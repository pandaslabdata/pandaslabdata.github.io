<style>*{box-sizing:border-box}html,body{margin:0}html{color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout: one centered column, hero banner fading into navy wool ground, gold stitched buttons */
:root{
  --bg:#0b111a;          /* deep navy ground */
  --panel:#2D343D;       /* brand navy */
  --gold:#D49318;        /* brand gold */
  --gold-soft:#E3A93C;
  --cream:#EFE6CF;       /* text */
  --cream-dim:#C9BFA7;   /* secondary text */
  --ink:#171310;         /* text on gold */
  --stitch:rgba(212,147,24,.55);
  color-scheme: dark;
}
body{background:var(--bg);color:var(--cream);font-family:'Nunito',system-ui,'Segoe UI',sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 28px;}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.brand h1{margin:0;font-weight:900;font-size:clamp(3rem,13vw,4.4rem);line-height:1;
  letter-spacing:-.02em;color:var(--cream);
  text-shadow:0 2px 0 rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.45)}
.hero{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  -webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent 99.5%);
  mask-image:linear-gradient(to bottom,#000 78%,transparent 99.5%)}
.hero img{display:block;width:100%;max-width:100%;height:auto;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 4%,#000 96%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 4%,#000 96%,transparent 100%)}
.tagline{text-align:center;font-weight:600;color:var(--cream-dim);font-size:1.02rem;
  line-height:1.5;margin:-30px 0 0;text-wrap:balance}
.tagline strong{color:var(--cream);font-weight:800}
.socials{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.socials a{display:flex;align-items:center;justify-content:center;width:46px;height:46px;
  border-radius:50%;background:var(--panel);border:1.5px dashed var(--stitch);
  transition:transform .15s ease,background .15s ease}
.socials a:hover{transform:translateY(-2px);background:#353d48}
.socials svg{width:21px;height:21px;fill:var(--cream)}
.links{display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;
  background:var(--gold);color:var(--ink);text-decoration:none;font-weight:900;
  font-size:1.05rem;letter-spacing:.015em;border-radius:16px;padding:16px 20px;
  box-shadow:0 3px 0 #8f6310;transition:transform .12s ease,box-shadow .12s ease}
.btn::after{content:"";position:absolute;inset:5px;border:1.5px dashed rgba(23,19,16,.35);
  border-radius:11px;pointer-events:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #8f6310}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #8f6310}
.btn:focus-visible,.socials a:focus-visible,.copy:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.btn svg{width:18px;height:18px;fill:var(--ink);flex:none}
.contact{background:var(--panel);border:1.5px dashed var(--stitch);border-radius:16px;
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.contact .lab{min-width:0}
.contact .k{display:block;font-size:.72rem;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold-soft)}
.contact .v{font-weight:800;color:var(--cream);user-select:all;word-break:break-all}
.copy{background:transparent;color:var(--gold-soft);border:1.5px solid var(--gold-soft);
  border-radius:10px;font:inherit;font-weight:800;font-size:.85rem;padding:7px 14px;cursor:pointer}
.copy:hover{background:rgba(212,147,24,.12)}
.foot{text-align:center;color:var(--cream-dim);font-size:.78rem;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;padding-top:18px;position:relative}
.foot::before{content:"";position:absolute;top:0;left:18%;right:18%;
  border-top:2px dashed var(--stitch)}
.foot b{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.btn,.socials a{transition:none}}
</style>
