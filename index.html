const LANGS=["en","de","es","it","fr"];
function setLang(l){
  try{localStorage.setItem("pl_lang",l)}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(el=>{const k=el.getAttribute("data-i");if(I18N[l][k])el.textContent=I18N[l][k]});
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
}
(function(){
  const box=document.getElementById("langs");
  LANGS.forEach(l=>{const b=document.createElement("button");b.dataset.l=l;b.textContent=l.toUpperCase();b.onclick=()=>setLang(l);box.appendChild(b)});
  let saved=null;try{saved=localStorage.getItem("pl_lang")}catch(e){}
  const nav=(navigator.language||"en").slice(0,2).toLowerCase();
  setLang(saved&&LANGS.includes(saved)?saved:(LANGS.includes(nav)?nav:"en"));
})();
function copyMail(btn){
  const m="info@pandaslab.it";
  const done=()=>{const l=document.documentElement.lang||"en";btn.textContent=I18N[l].copied;setTimeout(()=>{btn.textContent=I18N[l].copy},1600)};

}
